<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Generator și verificator de parole</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#64708a;--ac:#2f5bea;--bd:#dde3f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141f;--card:#192033;--tx:#e8ecf6;--mut:#93a0bd;--ac:#6c8cff;--bd:#2a3350}}
:root[data-theme="dark"]{--bg:#10141f;--card:#192033;--tx:#e8ecf6;--mut:#93a0bd;--ac:#6c8cff;--bd:#2a3350}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:16px}
header{text-align:center;padding:12px 0}
h1{font-size:1.5rem;margin:0}
.by{color:var(--mut);font-size:.9rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
h2{font-size:1.1rem;margin:0 0 10px}
.out{display:flex;gap:8px}
input[type=text],input[type=password]{flex:1;min-width:0;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:1rem ui-monospace,Menlo,monospace}
button{padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:.95rem;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
label{display:flex;align-items:center;gap:8px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center}
input[type=range]{width:100%}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;width:0;transition:width .25s,background .25s}
ul{margin:8px 0 0;padding-left:20px;color:var(--mut);font-size:.9rem}
.small{color:var(--mut);font-size:.85rem}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:14px 0}
</style>
</head>
<body>
<main>
<header>
  <h1>🔐 Generator și verificator de parole</h1>
  <div class="by"><b>Postica Constantin</b> · FEIE, UTM</div>
</header>

<section class="card">
  <h2>Generator</h2>
  <div class="out">
    <input type="text" id="gen" readonly aria-label="Parola generată">
    <button id="copy">Copiază</button>
  </div>
  <div class="row" style="margin-top:12px"><span>Lungime: <b id="lenv">16</b></span></div>
  <input type="range" id="len" min="8" max="64" value="16">
  <label><input type="checkbox" id="lo" checked> Litere mici (a–z)</label>
  <label><input type="checkbox" id="up" checked> Litere mari (A–Z)</label>
  <label><input type="checkbox" id="di" checked> Cifre (0–9)</label>
  <label><input type="checkbox" id="sy" checked> Simboluri (!@#$…)</label>
  <button id="new" style="margin-top:8px">Generează o parolă nouă</button>
</section>

<section class="card">
  <h2>Verificator</h2>
  <div class="out">
    <input type="password" id="chk" placeholder="Introdu o parolă pentru verificare" autocomplete="off">
    <button class="sec" id="tog">Arată</button>
  </div>
  <div class="bar"><i id="fill"></i></div>
  <div class="row"><b id="lvl">—</b><span class="small" id="ent"></span></div>
  <ul id="tips"></ul>
  <p class="small">Parola se verifică doar în browserul tău și nu este trimisă nicăieri.</p>
</section>

<footer>Realizat în cadrul cursului „TI și Securitate cibernetică”, FEIE, UTM</footer>
</main>

<script>
const $=id=>document.getElementById(id);
const sets={lo:"abcdefghijklmnopqrstuvwxyz",up:"ABCDEFGHIJKLMNOPQRSTUVWXYZ",di:"0123456789",sy:"!@#$%^&*()-_=+[]{};:,.?/"};
function rnd(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}
function generate(){
  const act=Object.keys(sets).filter(k=>$(k).checked);
  if(!act.length){$("gen").value="Alege cel puțin un tip de caractere";return}
  const L=+$("len").value,pool=act.map(k=>sets[k]).join("");
  const chars=act.map(k=>sets[k][rnd(sets[k].length)]);
  while(chars.length<L)chars.push(pool[rnd(pool.length)]);
  for(let i=chars.length-1;i>0;i--){const j=rnd(i+1);[chars[i],chars[j]]=[chars[j],chars[i]]}
  $("gen").value=chars.slice(0,L).join("");
}
function check(){
  const p=$("chk").value,tips=[];
  if(!p){$("fill").style.width="0";$("lvl").textContent="—";$("ent").textContent="";$("tips").innerHTML="";return}
  let pool=0;
  if(/[a-z]/.test(p))pool+=26;if(/[A-Z]/.test(p))pool+=26;if(/\d/.test(p))pool+=10;if(/[^A-Za-z0-9]/.test(p))pool+=24;
  let bits=p.length*Math.log2(pool||1);
  const common=["parola","password","qwerty","123456","admin","iloveyou","welcome","parola123","letmein"];
  if(common.some(c=>p.toLowerCase().includes(c))){bits=Math.min(bits,20);tips.push("Conține un cuvânt sau o secvență foarte comună.")}
  if(/(.)\1{2,}/.test(p)){bits-=8;tips.push("Evită repetarea aceluiași caracter.")}
  if(/(012|123|234|345|456|567|678|789|abc|bcd|cde)/i.test(p)){bits-=8;tips.push("Evită secvențele (123, abc).")}
  if(p.length<12)tips.push("Folosește cel puțin 12 caractere.")
  if(!/[a-z]/.test(p)||!/[A-Z]/.test(p))tips.push("Combină litere mici și mari.")
  if(!/\d/.test(p))tips.push("Adaugă cifre.")
  if(!/[^A-Za-z0-9]/.test(p))tips.push("Adaugă simboluri.")
  bits=Math.max(0,bits);
  const lv=bits<28?["Foarte slabă","#e5484d",15]:bits<45?["Slabă","#f08a24",35]:bits<60?["Medie","#e5b800",60]:bits<80?["Puternică","#46a758",82]:["Foarte puternică","#12a594",100];
  $("fill").style.width=lv[2]+"%";$("fill").style.background=lv[1];
  $("lvl").textContent=lv[0];$("lvl").style.color=lv[1];
  $("ent").textContent="Entropie ≈ "+Math.round(bits)+" biți";
  $("tips").innerHTML=tips.map(t=>"<li>"+t+"</li>").join("");
}
$("len").oninput=()=>{$("lenv").textContent=$("len").value;generate()};
["lo","up","di","sy"].forEach(k=>$(k).onchange=generate);
$("new").onclick=generate;
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("gen").value);$("copy").textContent="Copiat ✓"}catch(e){$("gen").select();$("copy").textContent="Selectat"}setTimeout(()=>$("copy").textContent="Copiază",1500)};
$("chk").oninput=check;
$("tog").onclick=()=>{const h=$("chk").type==="password";$("chk").type=h?"text":"password";$("tog").textContent=h?"Ascunde":"Arată"};
generate();
</script>
</body>
</html>
